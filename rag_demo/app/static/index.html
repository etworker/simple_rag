<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 文档问答系统</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
    <h1>📚 RAG</h1>
    <button class="tab-btn active" onclick="showPage('kb')">知识库</button>
    <button class="tab-btn" onclick="showPage('qa')">问答</button>
    <button class="tab-btn" onclick="showPage('settings')">设置</button>
    <div class="topbar-right">
        <button class="top-btn" id="debugBtn" onclick="toggleDebug()">🐛 Debug</button>
    </div>
</div>
<div class="main">
    <!-- ============ 知识库管理页 ============ -->
    <div class="page kb-page active" id="pageKb">
        <!-- 左侧 -->
        <div class="kb-left" id="kbLeft">
            <div class="resize-handle" id="kbResizeHandle"></div>
            <div class="upload-box">
                <div class="upload-zone" id="uploadZone" onclick="if(!this.classList.contains('disabled'))document.getElementById('fileInput').click()">
                    📄 <span>点击或拖拽上传（PDF/Word）</span>
                    <input type="file" id="fileInput" accept=".pdf,.docx" onchange="handleUpload(this.files[0])">
                </div>
            </div>
            <div class="step-area" id="stepArea">
                <div class="step-title"><span id="stepTitle">处理中...</span><span class="step-cancel" onclick="cancelUpload()">✕</span></div>
                <div id="stepItems"></div>
            </div>
            <div class="review-btn" id="reviewBtn" onclick="onReviewBtnClick()">⚠️ 预审核完成</div>
            <div class="doc-list-area">
                <div id="docList"></div>
            </div>
        </div>
        <div class="kb-toggle" id="kbToggle" onclick="toggleKbSidebar()">◀</div>
        <!-- 右侧 -->
        <div class="kb-right">
            <div class="kb-tabs" id="kbTabs">
                <button class="kb-tab active" onclick="switchKbTab('preview')">📄 文档预览</button>
                <button class="kb-tab" id="reviewTabBtn" onclick="switchKbTab('review')" style="display:none">⚠️ 预审核</button>
            </div>
            <!-- 文档预览 -->
            <div class="preview-panel active" id="previewPanel">
                <div class="preview-empty" id="previewEmpty">← 点击左侧文档查看</div>
                <div class="preview-content" id="previewContent" style="display:none">
                    <div class="preview-header">
                        <span id="previewTitle">文档</span>
                        <div class="page-nav" id="kbPager">
                            <span class="nav-btn" onclick="kbPrevPage()">◀</span>
                            <input type="number" id="kbPageInput" value="1" min="1" onchange="kbGoToPage()" onkeydown="if(event.key==='Enter')kbGoToPage()">
                            <span>/ <span id="kbTotalPages">?</span></span>
                            <span class="nav-btn" onclick="kbNextPage()">▶</span>
                        </div>
                    </div>
                    <div class="preview-body" id="kbPdfContainer"></div>
                </div>
            </div>
            <!-- 预审核结果 -->
            <div class="review-panel" id="reviewPanel">
<div class="review-actions">
<span class="info" id="reviewInfo">⚠️ 发现矛盾</span>
<button class="btn btn-ok" onclick="confirmIngest()">确认入库</button>
<button class="btn btn-no" onclick="rejectIngest()">取消入库</button>
</div>
                <div class="conflict-list" id="conflictList"></div>
                <div class="compare-panel" id="comparePanel">
                    <div class="compare-tabs">
                        <button class="compare-tab active" id="cmpTabA" onclick="switchCompare('a')">X 新文档</button>
                        <button class="compare-tab" id="cmpTabB" onclick="switchCompare('b')">B? 已有文档</button>
                        <span class="compare-close" onclick="closeCompare()">✕ 关闭对比</span>
                    </div>
                    <div class="compare-body" id="compareBody"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ 问答页 ============ -->
    <div class="page qa-page" id="pageQa">
        <div class="qa-sidebar" id="qaSidebar">
            <div class="qa-sidebar-header">
                <span class="title">💬 会话历史</span>
                <button class="new-btn" onclick="newQaSession()">+ 新对话</button>
            </div>
            <div class="qa-sidebar-list" id="qaSessionList">
                <div class="qa-sidebar-empty">暂无历史会话</div>
            </div>
        </div>
        <div class="qa-sidebar-toggle" id="qaSidebarToggle" onclick="toggleQaSidebar()">◀</div>
        <div class="qa-main">
            <div class="qa-messages" id="qaMessages">
                <div class="msg bot" id="qaWelcome">
                    <p>👋 你好！我是文档问答助手。</p><p>你可以针对已入库的文档提问，我会给出带来源引用的回答。如果多份文档存在矛盾，我会标注出来。</p>
                </div>
            </div>
            <div class="qa-input">
                <input type="text" id="qaInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter')sendQuestion()">
                <button onclick="sendQuestion()">发送</button>
            </div>
        </div>
        <div class="qa-preview" id="qaPreview">
            <div class="qa-preview-header">
                <span class="title" id="qaPreviewTitle">文档预览</span>
                <button class="close-btn" onclick="closeQaPreview()">✕</button>
            </div>
            <div class="qa-preview-body" id="qaPdfContainer"></div>
        </div>
    </div>

    <!-- ============ 设置页 ============ -->
    <div class="page settings-page" id="pageSettings">
        <div class="settings-nav">
            <button class="sn active" onclick="switchSettingsTab('llm',this)">LLM 模型</button>
            <button class="sn" onclick="switchSettingsTab('emb',this)">向量模型</button>
            <button class="sn" onclick="switchSettingsTab('ret',this)">检索/审核</button>
            <button class="sn" onclick="switchSettingsTab('prompt',this)">Prompt</button>
            <button class="sn" onclick="switchSettingsTab('chat',this)">对话</button>
            <div class="settings-nav-spacer"></div>
            <span id="settingsStatus" class="hint"></span>
            <button class="mini-btn primary" onclick="saveSettings()">💾 保存</button>
        </div>
        <div class="settings-content">
            <!-- LLM -->
            <div class="sp active" id="sp-llm">
                <div class="setting-row"><label>Profile</label><select id="llmProfileSelect" onchange="renderLlmProfile()"></select><button class="mini-btn" onclick="addLlmProfile()">+ 新增</button><button class="mini-btn danger" onclick="delLlmProfile()">删除</button></div>
                <div id="llmProfileFields"></div>
                <div class="setting-section-title">场景路由</div>
                <div class="setting-row"><label>问答</label><select id="route-qa"></select></div>
                <div class="setting-row"><label>预审核</label><select id="route-pre_review"></select></div>
                <div class="setting-row"><label>冲突检测</label><select id="route-conflict_detection"></select></div>
            </div>
            <!-- Embedding -->
            <div class="sp" id="sp-emb">
                <div class="setting-row"><label>模型</label><input id="emb-model" class="long"></div>
                <div class="setting-row"><label>device</label><select id="emb-device"><option>auto</option><option>cpu</option><option>cuda</option><option>mps</option></select></div>
                <div class="setting-row"><label>dtype</label><select id="emb-dtype"><option value="">默认</option><option>auto</option><option>float16</option><option>bfloat16</option><option>float32</option></select></div>
                <div class="setting-row"><label>GPU ID</label><input type="number" id="emb-gpu_id" style="width:60px"></div>
            </div>
            <!-- Retrieval / Pre-review / Conflict -->
            <div class="sp" id="sp-ret">
                <div class="setting-section-title">检索</div>
                <div class="setting-row"><label>top_k</label><input type="number" id="ret-top_k" style="width:80px"></div>
                <div class="setting-row"><label>相似度阈值</label><input type="number" step="0.05" id="ret-threshold" style="width:80px"></div>
                <div class="setting-section-title">预审核</div>
                <div class="setting-row"><label>相似度阈值</label><input type="number" step="0.05" id="pr-threshold" style="width:80px"></div>
                <div class="setting-row"><label>batch_size</label><input type="number" id="pr-batch" style="width:80px"><span class="hint">0=自动</span></div>
                <div class="setting-section-title">冲突检测</div>
                <div class="setting-row"><label>min_score</label><input type="number" step="0.05" id="cd-min_score" style="width:80px"></div>
                <div class="setting-row"><label>min_similarity</label><input type="number" step="0.05" id="cd-min_sim" style="width:80px"></div>
                <div class="setting-row"><label>max_similarity</label><input type="number" step="0.05" id="cd-max_sim" style="width:80px"></div>
            </div>
            <!-- Prompts -->
            <div class="sp" id="sp-prompt">
                <div class="setting-section-title">QA 系统提示</div>
                <textarea id="prompt-system" class="prompt-area" rows="6"></textarea>
                <div class="setting-section-title">Context 模板</div>
                <textarea id="prompt-context" class="prompt-area" rows="3"></textarea>
                <div class="setting-section-title">冲突警告模板</div>
                <textarea id="prompt-conflict" class="prompt-area" rows="3"></textarea>
                <div class="setting-section-title">Judge Prompt 文件路径（空=内置默认）</div>
                <div class="setting-row"><input id="judge-prompt_file" class="long" placeholder="留空使用内置 prompt"></div>
            </div>
            <!-- Chat -->
            <div class="sp" id="sp-chat">
                <div class="setting-row"><label>max_history</label><input type="number" id="chat-max_history" style="width:80px"></div>
            </div>
        </div>
    </div>
</div>
<div id="debugPanel"></div>

<script src="/static/app.js"></script>
</body>
</html>
