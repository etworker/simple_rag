[project]
name = "rag-demo"
version = "0.1.0"
description = "RAG 文档问答系统快速原型 — 含预审核 + 问答 + 冲突标记"
requires-python = ">=3.10"
dependencies = [
    "doc-parser",
    "version-diff",
    "llm-chat",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "fastembed>=0.6.0",
    "websockets>=12.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "python-multipart>=0.0.32",
    "pymupdf>=1.24.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
doc-parser = { workspace = true }
version-diff = { workspace = true }
llm-chat = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "FURB", "RUF"]
ignore = ["BLE001", "S110", "ASYNC230", "RUF001", "RUF002", "RUF003", "E402", "B008", "RUF006"]

[tool.ruff.lint.per-file-ignores]
# config_store.py 的 CONFIG_DESCRIPTIONS 含长中文说明字符串，无法合理拆行
"app/services/config_store.py" = ["E501"]
