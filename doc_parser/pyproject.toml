[project]
name = "doc-parser"
version = "0.1.0"
description = "通用文档解析库 — PDF/Word → 结构化段落+表格"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_parser"]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "FURB", "RUF"]
# 策略性忽略：盲异常捕获(BLE001)/空except(S110)/异步阻塞文件操作(ASYNC230)
# 对这些既有代码改起来风险大收益低，保持关注错误而非强制重构
ignore = ["BLE001", "S110", "ASYNC230", "RUF001", "RUF002", "RUF003"]
