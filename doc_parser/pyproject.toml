[project]
name = "doc-parser"
version = "0.1.0"
description = "通用文档解析库 — PDF/Word → 结构化段落+表格"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_parser"]
