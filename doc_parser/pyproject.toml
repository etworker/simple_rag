[project]
name = "doc-parser"
version = "0.1.0"
description = "通用文档解析库 — PDF/Word → 结构化段落+表格"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
docling = ["docling>=2.0"]  # Docling TableFormer 深度学习表格后端（PDF 支持为核心内置，GPU/CPU 均可）
mineru = ["mineru[pipeline,vlm]"]  # MinerU VLM/OCR 后端：pipeline=OCR布局, vlm=VLM（不装lmdeploy/vllm，Windows/Linux均可用）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_parser"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "FURB", "RUF"]
# 策略性忽略：盲异常捕获(BLE001)/空except(S110)/异步阻塞文件操作(ASYNC230)
# 对这些既有代码改起来风险大收益低，保持关注错误而非强制重构
ignore = ["BLE001", "S110", "ASYNC230", "RUF001", "RUF002", "RUF003"]
