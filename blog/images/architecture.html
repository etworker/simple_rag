<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RAG 知识冲突检测系统架构图</title>
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>
<div class="container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#232F3E"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9900"/>
    </marker>
    <!-- Drop shadow -->
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#232F3E">企业文档 RAG 系统 — 入库时知识冲突检测架构</text>

  <!-- ============ LEFT: Input Layer ============ -->
  <!-- User icon (simplified person) -->
  <g transform="translate(70, 120)">
    <rect x="0" y="0" width="130" height="180" rx="10" fill="#fff" stroke="#232F3E" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Person icon -->
    <circle cx="65" cy="55" r="22" fill="#232F3E"/>
    <path d="M25,110 Q25,80 65,80 Q105,80 105,110 L105,120 L25,120 Z" fill="#232F3E"/>
    <text x="65" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">文档上传</text>
    <text x="65" y="168" text-anchor="middle" font-size="11" fill="#666">(Web UI)</text>
  </g>

  <!-- Document types -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#FFF3E0" stroke="#FF9900" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="75" y="22" text-anchor="middle" font-size="11" fill="#E65100">📄 PDF 管理手册</text>
    <text x="75" y="44" text-anchor="middle" font-size="11" fill="#E65100">📋 DOCX 规范</text>
    <text x="75" y="66" text-anchor="middle" font-size="11" fill="#E65100">📚 多版本文档</text>
    <text x="75" y="85" text-anchor="middle" font-size="9" fill="#999">(R5-18 ~ R5-22)</text>
  </g>

  <!-- ============ MIDDLE: Processing Layer ============ -->
  <!-- Main dashed box -->
  <rect x="250" y="60" width="520" height="440" rx="12" fill="#fff" stroke="#232F3E" stroke-width="2" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <rect x="250" y="60" width="520" height="32" rx="12" fill="#232F3E"/>
  <rect x="250" y="80" width="520" height="12" fill="#232F3E"/>
  <text x="510" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">FastAPI 应用服务 (Amazon EC2)</text>

  <!-- Module 1: Document Parsing -->
  <g transform="translate(275, 110)">
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">① 文档解析</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#333">pdfplumber 结构化提取</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" fill="#666">• margin 编号列自动分离</text>
    <text x="110" y="74" text-anchor="middle" font-size="10" fill="#666">• 跨页表格合并 • 噪音过滤</text>
  </g>

  <!-- Module 2: Semantic Pairing -->
  <g transform="translate(525, 110)">
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">② 语义配对</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#333">BGE Embedding 向量化</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" fill="#666">• FAISS 高速相似度检索</text>
    <text x="110" y="74" text-anchor="middle" font-size="10" fill="#666">• 阈值 ≥ 0.80 → 候选配对</text>
  </g>

  <!-- Module 3: LLM Conflict Detection -->
  <g transform="translate(275, 225)">
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">③ LLM 冲突判定</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#333">Amazon Bedrock Converse API</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" fill="#666">• GLM-4.7-flash 模型</text>
    <text x="110" y="74" text-anchor="middle" font-size="10" fill="#666">• 差异分类：矛盾/细化/等价</text>
  </g>

  <!-- Module 4: Quality Gate -->
  <g transform="translate(525, 225)">
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">④ 质量门禁</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#333">通过 / 驳回 决策</text>
    <text x="110" y="58" text-anchor="middle" font-size="10" fill="#666">• 冲突报告生成</text>
    <text x="110" y="74" text-anchor="middle" font-size="10" fill="#666">• 人工确认后方可入库</text>
  </g>

  <!-- Flow arrows inside processing box -->
  <!-- Module 1 → Module 2 -->
  <line x1="495" y1="155" x2="525" y2="155" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Module 2 → Module 3 (down) -->
  <path d="M635,200 L635,210 L385,210 L385,225" stroke="#232F3E" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Module 3 → Module 4 -->
  <line x1="495" y1="270" x2="525" y2="270" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline progress bar -->
  <g transform="translate(290, 340)">
    <rect x="0" y="0" width="460" height="30" rx="15" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
    <rect x="2" y="2" width="115" height="26" rx="13" fill="#1565C0"/>
    <rect x="117" y="2" width="115" height="26" rx="13" fill="#2E7D32"/>
    <rect x="232" y="2" width="115" height="26" rx="13" fill="#E65100"/>
    <rect x="347" y="2" width="111" height="26" rx="13" fill="#C62828"/>
    <text x="59" y="20" text-anchor="middle" font-size="10" fill="#fff">解析</text>
    <text x="174" y="20" text-anchor="middle" font-size="10" fill="#fff">配对</text>
    <text x="289" y="20" text-anchor="middle" font-size="10" fill="#fff">判定</text>
    <text x="402" y="20" text-anchor="middle" font-size="10" fill="#fff">门禁</text>
  </g>

  <!-- Output section inside box -->
  <g transform="translate(290, 390)">
    <rect x="0" y="0" width="460" height="95" rx="8" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>
    <text x="230" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">📊 检测报告输出</text>
    <text x="230" y="40" text-anchor="middle" font-size="10" fill="#666">差异总数 | 矛盾项 | 细化项 | 等价项 | 新增内容</text>
    <text x="115" y="65" text-anchor="middle" font-size="11" fill="#2E7D32">✅ 无矛盾 → 自动入库</text>
    <text x="345" y="65" text-anchor="middle" font-size="11" fill="#C62828">⚠️ 有矛盾 → 人工审核</text>
    <line x1="230" y1="52" x2="230" y2="80" stroke="#DDD" stroke-width="1"/>
  </g>

  <!-- ============ RIGHT SIDE: AWS Services ============ -->

  <!-- Amazon S3 -->
  <g transform="translate(830, 80)">
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#fff" stroke="#3F8624" stroke-width="2" filter="url(#shadow)"/>
    <!-- S3 bucket icon (simplified) -->
    <ellipse cx="80" cy="35" rx="25" ry="12" fill="#3F8624"/>
    <rect x="55" y="35" width="50" height="25" fill="#3F8624"/>
    <ellipse cx="80" cy="60" rx="25" ry="12" fill="#3F8624"/>
    <text x="80" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">S3</text>
    <text x="80" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#3F8624">Amazon S3</text>
    <text x="80" y="96" text-anchor="middle" font-size="10" fill="#666">文档存储 / 版本控制</text>
  </g>

  <!-- Amazon Bedrock -->
  <g transform="translate(830, 210)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#fff" stroke="#FF9900" stroke-width="2" filter="url(#shadow)"/>
    <!-- Bedrock icon (simplified hexagon) -->
    <polygon points="80,20 105,33 105,58 80,71 55,58 55,33" fill="#FF9900" stroke="#CC7A00" stroke-width="1"/>
    <text x="80" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">AI</text>
    <text x="80" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#FF9900">Amazon Bedrock</text>
    <text x="80" y="103" text-anchor="middle" font-size="9" fill="#666">GLM-4.7-flash</text>
    <text x="80" y="116" text-anchor="middle" font-size="9" fill="#666">(东京 / 美国区域)</text>
  </g>

  <!-- FAISS Vector Store -->
  <g transform="translate(830, 360)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#fff" stroke="#7B1FA2" stroke-width="2" filter="url(#shadow)"/>
    <!-- Vector icon (grid dots) -->
    <g fill="#7B1FA2">
      <circle cx="60" cy="30" r="4"/><circle cx="80" cy="30" r="4"/><circle cx="100" cy="30" r="4"/>
      <circle cx="60" cy="48" r="4"/><circle cx="80" cy="48" r="4"/><circle cx="100" cy="48" r="4"/>
      <circle cx="60" cy="66" r="4"/><circle cx="80" cy="66" r="4"/><circle cx="100" cy="66" r="4"/>
    </g>
    <text x="80" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B1FA2">FAISS 向量知识库</text>
    <text x="80" y="103" text-anchor="middle" font-size="9" fill="#666">Embeddings / 表格 / 章节</text>
    <text x="80" y="116" text-anchor="middle" font-size="9" fill="#666">BGE-base-zh-v1.5</text>
  </g>

  <!-- ============ ARROWS: Main Flow ============ -->

  <!-- User → Processing Layer -->
  <path d="M200,200 L250,200" stroke="#232F3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="225" y="193" text-anchor="middle" font-size="9" fill="#666">上传</text>

  <!-- Documents → Processing Layer -->
  <path d="M210,360 L260,300" stroke="#232F3E" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,2"/>

  <!-- Processing → S3 (bidirectional) -->
  <path d="M770,130 L830,130" stroke="#3F8624" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M830,145 L770,145" stroke="#3F8624" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
  <text x="800" y="123" text-anchor="middle" font-size="9" fill="#3F8624">存/取</text>

  <!-- Processing → Bedrock -->
  <path d="M770,260 L830,260" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="800" y="253" text-anchor="middle" font-size="9" fill="#FF9900">API</text>

  <!-- Processing → FAISS -->
  <path d="M770,400 L830,420" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="795" y="398" text-anchor="middle" font-size="9" fill="#7B1FA2">✅ 通过后入库</text>

  <!-- ============ BOTTOM: China Region Alternative ============ -->
  <g transform="translate(250, 530)">
    <rect x="0" y="0" width="740" height="100" rx="10" fill="#FFF8E1" stroke="#FF9900" stroke-width="2" stroke-dasharray="6,3"/>
    <!-- Flag and title -->
    <text x="20" y="28" font-size="14">🇨🇳</text>
    <text x="45" y="28" font-size="13" font-weight="bold" fill="#E65100">中国区域替代方案（无 Amazon Bedrock）</text>

    <!-- EC2 G5 box -->
    <rect x="20" y="40" width="320" height="48" rx="6" fill="#fff" stroke="#FF9900" stroke-width="1"/>
    <text x="180" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#232F3E">EC2 G5 (NVIDIA A10G 24GB)</text>
    <text x="180" y="78" text-anchor="middle" font-size="10" fill="#666">llama.cpp + GLM-4.7-flash Q4-K-M | 2 并发 × 80K 上下文</text>

    <!-- OpenAI API compat -->
    <rect x="360" y="40" width="360" height="48" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1"/>
    <text x="540" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">OpenAI-compatible API</text>
    <text x="540" y="78" text-anchor="middle" font-size="10" fill="#666">修改 config.base_url + config.model → 业务代码零改动</text>
  </g>

  <!-- Dashed line connecting China box to main processing -->
  <path d="M510,500 L510,530" stroke="#FF9900" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <text x="520" y="518" font-size="9" fill="#FF9900">替代</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(20, 660)">
    <text x="0" y="12" font-size="10" fill="#999">图例：</text>
    <line x1="40" y1="8" x2="70" y2="8" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="75" y="12" font-size="9" fill="#666">数据流</text>
    <line x1="120" y1="8" x2="150" y2="8" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="155" y="12" font-size="9" fill="#666">可选/辅助</text>
    <rect x="210" y="1" width="14" height="14" rx="3" fill="none" stroke="#232F3E" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="230" y="12" font-size="9" fill="#666">服务边界</text>
  </g>

  <!-- Footer -->
  <text x="600" y="740" text-anchor="middle" font-size="10" fill="#BBB">Architecture: VersionRAG — Knowledge Conflict Detection at Ingestion Time | AWS Services: S3, Bedrock, EC2</text>

</svg>
</div>
</body>
</html>
