[project]
name = "llm-chat"
version = "0.1.0"
description = "轻量多后端 LLM 多轮对话管理 — 支持 Bedrock Converse / OpenAI 兼容接口"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_chat"]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "FURB", "RUF"]
ignore = ["BLE001", "S110", "ASYNC230", "RUF001", "RUF002", "RUF003"]
