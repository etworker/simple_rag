[project]
name = "version-diff"
version = "0.1.0"
description = "文档差异检测引擎 — 语义配对 + LLM 矛盾判断"
requires-python = ">=3.10"
dependencies = [
    "doc-parser",
    "llm-chat",
    "fastembed>=0.6.0",
    "faiss-gpu>=1.7.4",
    "numpy>=1.24.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
doc-parser = { workspace = true }
llm-chat = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/version_diff"]

[tool.hatch.build.targets.wheel.force-include]
"src/version_diff/prompts" = "version_diff/prompts"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "FURB", "RUF"]
ignore = ["BLE001", "S110", "ASYNC230", "RUF001", "RUF002", "RUF003", "E402"]
